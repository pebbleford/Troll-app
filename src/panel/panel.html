<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'">
  <title>Troll Remote</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 22px; background: #0f0f14; color: #f1f1f5;
      font-family: "Segoe UI", -apple-system, system-ui, sans-serif; user-select: none;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: #9a9aab; margin: 0 0 18px; font-size: 14px; }
    .qr { background: #fff; border-radius: 16px; padding: 12px; width: 220px; height: 220px; margin: 0 auto 14px; display: block; }
    .qr img { width: 100%; height: 100%; image-rendering: pixelated; }
    .url { text-align: center; font-family: Consolas, ui-monospace, monospace; font-size: 14px; color: #c4b5fd; user-select: text; word-break: break-all; }
    .code { text-align: center; margin: 10px 0 4px; color: #9a9aab; font-size: 13px; }
    .code b { display: block; color: #fff; font-size: 26px; letter-spacing: 0.3em; margin-top: 2px; user-select: text; }
    .status { margin: 14px 0; padding: 10px 12px; border-radius: 10px; background: #1a1a22; font-size: 14px; display: flex; gap: 8px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; flex: none; }
    .status.ok .dot { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { border: 0; border-radius: 10px; padding: 11px; font: inherit; font-size: 14px; font-weight: 600; background: #24242f; color: #fff; cursor: pointer; }
    button:hover { background: #2f2f3d; }
    button.primary { grid-column: span 2; background: #8b5cf6; }
    button.primary:hover { background: #9d74f8; }
    .tips { margin-top: 14px; font-size: 12.5px; color: #9a9aab; line-height: 1.55; }
    .tips kbd { background: #24242f; border-radius: 4px; padding: 1px 5px; color: #ddd; font-family: inherit; }
    .other { font-size: 12px; color: #77778a; text-align: center; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>😈 Troll Remote</h1>
  <p class="sub">Scan this with your iPad camera (same Wi-Fi as this PC).</p>
  <div class="qr"><img id="qr" alt=""></div>
  <div class="url" id="url"></div>
  <div class="other" id="other"></div>
  <div class="code">Code<b id="code"></b></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">Waiting for your iPad…</span></div>
  <div class="buttons">
    <button class="primary" id="hide">🥷 Hide this window (keeps running)</button>
    <button id="test">🔊 Test: air horn</button>
    <button id="media">📁 Media folder</button>
    <button id="quit" style="grid-column: span 2">Quit</button>
  </div>
  <div class="tips" id="tips"></div>
  <script src="panel.js"></script>
</body>
</html>
